# api.sparsan.com -> loan-poc API on 127.0.0.1:4000 (HTTP + WebSocket).
# Installed by scripts/deploy.sh as its own site file (loan-poc-api.conf); it never edits other sites.
# TLS: terminate at Cloudflare (proxied DNS record) or run `certbot --nginx -d api.sparsan.com` once;
# deploy.sh leaves a certbot-managed copy of this file alone.

map $http_upgrade $loan_poc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sparsan.com;

    # The API takes small JSON bodies only (login, chaos settings); audio goes over the WebSocket.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade (/ws carries text turns and voice audio).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $loan_poc_connection_upgrade;

        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its IP; the server trusts only this loopback hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice sessions are long-lived sockets; turns stream tokens and audio, so no buffering.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
