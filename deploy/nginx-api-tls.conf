# api.sparsan.com -> loan-poc API on 127.0.0.1:4000 (HTTP + WebSocket).
# Installed by `scripts/deploy.sh bootstrap` as its own site file (loan-poc-api.conf); it never edits other sites
# (the existing default_server stays the default; this block matches only server_name api.sparsan.com).
# This is the TLS variant, installed by bootstrap/cert once /etc/letsencrypt/live/api.sparsan.com/fullchain.pem exists
# (before that, deploy/nginx-api.conf is installed). The certificate is issued with `scripts/deploy.sh cert`
# (certbot webroot mode: no nginx plugin, nothing edits this file), so the repo owns the file in both states.

# The WebSocket URL carries the session token in its query string (/ws?token=...): log the path only, never the query.
log_format loan_poc_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent" $request_time';

map $http_upgrade $loan_poc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sparsan.com;
    access_log /var/log/nginx/access.log loan_poc_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line matches the existing 443 listener on this host and works on nginx 1.24 and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sparsan.com;
    access_log /var/log/nginx/access.log loan_poc_noquery;

    ssl_certificate     /etc/letsencrypt/live/api.sparsan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sparsan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:loan_poc_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API takes small JSON bodies only (login, chaos settings); audio goes over the WebSocket.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade (/ws carries text turns and voice audio).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $loan_poc_connection_upgrade;

        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its IP; the server trusts only this loopback hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice sessions are long-lived sockets; turns stream tokens and audio, so no buffering.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
