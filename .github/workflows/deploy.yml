name: Deploy

# Production deploys only from main in the canonical repo. Never triggered by pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  api:
    name: API to the VM (SSH, locked-down deploy user)
    needs: ci
    if: github.repository == 'RiskyAV/agentic-ivr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      API_BASE: ${{ vars.API_BASE || 'https://api.sparsan.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The key can only upload to /opt/loan-poc/incoming and run the activation script (forced command on the VM).
      - name: Install deploy key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          echo "DEPLOY_KEY_FILE=$RUNNER_TEMP/loan-poc-deploy-key" >> "$GITHUB_ENV"
          echo "DEPLOY_KNOWN_HOSTS_FILE=$RUNNER_TEMP/loan-poc-known-hosts" >> "$GITHUB_ENV"
          [ -n "$DEPLOY_HOST" ] || { echo "::error::missing variable DEPLOY_HOST"; exit 1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::missing secret DEPLOY_SSH_KEY"; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::missing secret DEPLOY_KNOWN_HOSTS"; exit 1; }
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/loan-poc-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/loan-poc-known-hosts"
      - name: Deploy API (type-check, git archive, upload, activate with health check and rollback)
        run: scripts/deploy.sh api
      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/loan-poc-deploy-key" "$RUNNER_TEMP/loan-poc-known-hosts"
      - name: Public health check
        run: |
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 5 "$API_BASE/api/health" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then echo "healthy: $body"; exit 0; fi
            echo "attempt $i: not healthy yet"; sleep 6
          done
          echo "::error::$API_BASE/api/health did not return {\"ok\":true}"; exit 1

  web:
    name: Web to Cloudflare Pages
    needs: [ci, api]
    if: github.repository == 'RiskyAV/agentic-ivr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      API_BASE: ${{ vars.API_BASE || 'https://api.sparsan.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web
        run: scripts/deploy.sh web-build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name loan-poc --branch main
